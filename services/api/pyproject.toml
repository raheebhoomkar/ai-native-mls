[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mls-api"
version = "0.1.0"
description = "AI-Native MLS API (modular monolith)"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16.3,<3",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.4,<3",
    "pillow>=13,<14",
    "boto3>=1.44,<2",
    # Below 5: OpenCV 5 dropped the Haar cascades used for face detection.
    "opencv-python-headless>=4.14,<5",
    "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic; constraint strings cannot be wrapped.
"migrations/versions/*" = ["E501"]
# Tests assert freely and use fixed test-only passwords.
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real providers and cost quota; run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls a real external provider (needs credentials in .env)"]
