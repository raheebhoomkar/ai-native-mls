name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mls
          POSTGRES_PASSWORD: mls
          POSTGRES_DB: mls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mls -d mls"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway credentials for the CI service container above.
      DATABASE_URL: postgresql+psycopg://mls:mls@localhost:5432/mls
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # Known vulnerabilities in the installed Python packages and the web app's runtime packages.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]" pip-audit
        working-directory: services/api
      - run: pip-audit --skip-editable
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - run: pnpm audit --prod
        working-directory: apps/web

  # Builds the image that is deployed, runs it with seeded demo data, and drives it in a browser.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mls
          POSTGRES_PASSWORD: mls
          POSTGRES_DB: mls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mls -d mls"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway value for the CI container only.
      E2E_PASSWORD: ci-e2e-password-123
      E2E_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-native-mls .
      - name: Start the app
        run: >-
          docker run -d --name app --network host
          -e DATABASE_URL=postgres://mls:mls@localhost:5432/mls
          -e SEED_DEMO_DATA=true
          -e SEED_PASSWORD="$E2E_PASSWORD"
          -e MEDIA_SIGNING_KEY=ci-throwaway-media-signing-key-0123456789
          ai-native-mls
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Wait for the app
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS "$E2E_BASE_URL/api/v1/health" && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - run: pnpm e2e
        working-directory: apps/web
      # Backs up the database the journeys just used, restores it elsewhere, compares rows.
      - name: Backup and restore check
        env:
          DATABASE_URL: postgresql://mls:mls@localhost:5432/mls
          PG_RUN: docker run --rm -i --network host postgres:17
        run: scripts/backup_restore_check.sh
      - name: App logs
        if: failure()
        run: docker logs app
