# Local development services only. Not a production deployment.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mls}
      POSTGRES_DB: ${POSTGRES_DB:-mls}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional vector store for semantic search (VECTOR_STORE=qdrant).
  # Start with: docker compose --profile qdrant up -d
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
